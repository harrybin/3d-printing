name: Pages skill runner

run-name: ${{ inputs.skill }} · ${{ inputs.model_path || inputs.image_dir || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      skill:
        description: Skill id from web/public/skills-manifest.json
        required: true
        type: choice
        options:
          - validate-stl-mesh
          - optimize-stl-for-print
          - stl-from-image-measurements
      model_path:
        description: Repo-relative STL path for mesh workflows
        required: false
        type: string
      image_dir:
        description: Repo-relative image directory for contact sheet generation
        required: false
        type: string
      infill_percent:
        description: Optional infill percentage for measure command
        required: false
        type: string
      prompt:
        description: Optional free-form note from the Pages UI
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  run-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare output folder
        run: mkdir -p workflow-output

      - name: Record request
        env:
          SKILL: ${{ inputs.skill }}
          MODEL_PATH: ${{ inputs.model_path }}
          IMAGE_DIR: ${{ inputs.image_dir }}
          INFILL_PERCENT: ${{ inputs.infill_percent }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          payload = {
              "skill": os.environ.get("SKILL", ""),
              "model_path": os.environ.get("MODEL_PATH", ""),
              "image_dir": os.environ.get("IMAGE_DIR", ""),
              "infill_percent": os.environ.get("INFILL_PERCENT", ""),
              "prompt": os.environ.get("PROMPT", ""),
          }
          pathlib.Path("workflow-output/request.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          PY

      - name: Copy selected skill source
        env:
          SKILL: ${{ inputs.skill }}
        run: |
          case "$SKILL" in
            validate-stl-mesh) skill_path=".github/skills/validate-stl-mesh/skill.md" ;;
            optimize-stl-for-print) skill_path=".github/skills/optimize-stl-for-print/skill.md" ;;
            stl-from-image-measurements) skill_path=".github/skills/stl-from-image-measurements/SKILL.md" ;;
            *) echo "Unsupported skill: $SKILL" >&2; exit 1 ;;
          esac
          cp "$skill_path" workflow-output/skill.md
          echo "skill_path=$skill_path" >> "$GITHUB_OUTPUT"
        id: selected_skill

      - name: Run requested skill-backed workflow
        env:
          SKILL: ${{ inputs.skill }}
          MODEL_PATH: ${{ inputs.model_path }}
          IMAGE_DIR: ${{ inputs.image_dir }}
          INFILL_PERCENT: ${{ inputs.infill_percent }}
        run: |
          set -euo pipefail
          case "$SKILL" in
            validate-stl-mesh)
              test -n "$MODEL_PATH"
              test -f "$MODEL_PATH"
              python scripts/mesh_tool.py info "$MODEL_PATH" --json | tee workflow-output/info.json
              python scripts/mesh_tool.py validate "$MODEL_PATH" | tee workflow-output/validate.txt
              python scripts/mesh_tool.py overhang "$MODEL_PATH" | tee workflow-output/overhang.txt
              ;;
            optimize-stl-for-print)
              test -n "$MODEL_PATH"
              test -f "$MODEL_PATH"
              INFILL_VALUE="${INFILL_PERCENT:-20}"
              python scripts/mesh_tool.py validate "$MODEL_PATH" | tee workflow-output/validate.txt
              python scripts/mesh_tool.py overhang "$MODEL_PATH" | tee workflow-output/overhang.txt
              python scripts/mesh_tool.py measure "$MODEL_PATH" --infill "$INFILL_VALUE" | tee workflow-output/measure.txt
              ;;
            stl-from-image-measurements)
              test -n "$IMAGE_DIR"
              test -d "$IMAGE_DIR"
              python scripts/make_contact_sheet.py "$IMAGE_DIR" --out "$IMAGE_DIR/_index.png" | tee workflow-output/contact-sheet.txt
              cp "$IMAGE_DIR/_index.png" workflow-output/_index.png
              ;;
            *)
              echo "Unsupported skill: $SKILL" >&2
              exit 1
              ;;
          esac

      - name: Add workflow summary
        env:
          SKILL: ${{ inputs.skill }}
          MODEL_PATH: ${{ inputs.model_path }}
          IMAGE_DIR: ${{ inputs.image_dir }}
          PROMPT: ${{ inputs.prompt }}
          SKILL_PATH: ${{ steps.selected_skill.outputs.skill_path }}
        run: |
          {
            echo "# Pages skill runner"
            echo
            echo "- Skill: \\`$SKILL\\`"
            echo "- Skill source: \\`$SKILL_PATH\\`"
            [ -n "$MODEL_PATH" ] && echo "- Model path: \\`$MODEL_PATH\\`"
            [ -n "$IMAGE_DIR" ] && echo "- Image dir: \\`$IMAGE_DIR\\`"
            [ -n "$PROMPT" ] && echo "- Prompt: $PROMPT"
            echo
            echo "This run was triggered by the GitHub Pages app and uses existing repo scripts plus the selected skill file as policy context."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pages-skill-runner-${{ github.run_number }}-${{ inputs.skill }}
          path: workflow-output
          if-no-files-found: error
