name: Build and Deploy SPA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/extensions/stl-canvas/**'
      - '.github/skills/**'
      - '.github/workflows/pages-skill-runner.yml'
      - 'web/**'
      - 'scripts/**'
      - 'models/**'
      - 'requirements.txt'
      - '.github/workflows/pages-spa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: web
        run: npm install

      - name: Sync STL models into SPA public assets
        run: |
          mkdir -p web/public/models
          find web/public/models -type f ! -name 'models.json' -delete || true
          if [ -d models ]; then
            cp -f models/*.stl web/public/models/ 2>/dev/null || true
          fi
          ls -1 web/public/models/*.stl 2>/dev/null | xargs -n1 basename | jq -R -s -c 'split("\n")[:-1] | {files:.}' > web/public/models/models.json

      - name: Build
        working-directory: web
        env:
          PAGES_WORKFLOW_REF: ${{ github.ref_name }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
