name: Build and Deploy SPA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/extensions/stl-canvas/**'
      - '.github/skills/**'
      - '.github/workflows/copilot-agent.yml'
      - 'web/**'
      - 'scripts/**'
      - 'docs/**'
      - 'requirements.txt'
      - '.github/workflows/pages-spa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout model catalog
        uses: actions/checkout@v4
        with:
          repository: harrybin/3d-printing-models
          ref: main
          path: build/catalog
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: web
        run: npm install

      - name: Build
        working-directory: web
        env:
          PAGES_WORKFLOW_REF: main
          CATALOG_ROOT: ${{ github.workspace }}/build/catalog
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.ref_name == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
